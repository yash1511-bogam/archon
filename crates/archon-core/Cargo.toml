[package]
name = "archon-core"
version = "0.1.0"
edition = "2021"
description = "Core runtime for the Archon AI agent framework"
license = "Apache-2.0"
repository = "https://github.com/archon-ai/archon"

[lib]
name = "archon_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }

[features]
default = []
python = ["pyo3"]

[dev-dependencies]
tokio-test = "0.4"
