[project]
name = "archon-framework"
version = "0.1.0"
description = "The production harness for AI agents — cost control, security, observability, memory built-in."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Yash Bogam", email = "yash1511-bogam@users.noreply.github.com" }]
keywords = ["ai", "agents", "llm", "framework", "production"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.13",
    "litellm>=1.83",
    "httpx>=0.28",
    "click>=8.3",
]

[project.urls]
Homepage = "https://github.com/yash1511-bogam/archon"
Repository = "https://github.com/yash1511-bogam/archon"
Issues = "https://github.com/yash1511-bogam/archon/issues"

[project.scripts]
archon = "archon.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "ruff>=0.15",
    "mypy>=1.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "RUF"]

# Files with intentional long lines:
#   - models.py: the model registry is a tabular literal whose readability
#     depends on column alignment; breaking rows would hurt more than help.
#   - dashboard.py: inline CSS / HTML string templates; wrapping them
#     obscures structure without improving anything.
[tool.ruff.lint.per-file-ignores]
"src/archon/models.py" = ["E501"]
"src/archon/dashboard.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
